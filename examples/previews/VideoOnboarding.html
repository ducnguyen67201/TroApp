<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tro · Video onboarding prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #252d36;
        --muted: #6d746f;
        --paper: #fffef9;
        --cream: #f8f9f3;
        --line: #e3e5dc;
        --orange: #e3a776;
        --green: #294b3d;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: #e9ebe5;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #bc6a31;
        outline-offset: 4px;
      }
      button {
        border: 0;
      }
      .preview-bar {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 28px;
      }
      .preview-name {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .preview-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ca8554;
      }
      .eyebrow {
        margin: 0 0 5px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .preview-name strong {
        font-size: 14px;
        font-weight: 600;
      }
      .preview-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .quiet-button {
        background: transparent;
        padding: 9px 10px;
        border-radius: 8px;
        color: var(--muted);
      }
      .quiet-button:hover {
        background: #00000006;
        color: var(--ink);
      }
      .outline-button,
      .primary-button {
        min-height: 40px;
        padding: 10px 16px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
      }
      .outline-button {
        border: 1px solid var(--line);
        background: var(--paper);
      }
      .primary-button {
        color: white;
        background: var(--green);
      }
      .primary-button:hover {
        background: #1b392d;
      }
      select {
        border: 1px solid #d5d9ce;
        background: transparent;
        padding: 8px;
        border-radius: 8px;
        font-size: 12px;
      }
      .app-frame {
        position: relative;
        isolation: isolate;
        margin: 0 24px;
        height: calc(100svh - 126px);
        min-height: 650px;
        overflow: hidden;
        border: 1px solid #c8cec3;
        border-radius: 15px;
        background: var(--cream);
        box-shadow: 0 16px 40px #28352d12;
      }
      .titlebar {
        height: 35px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        background: #242d37;
        color: #c2c8cc;
      }
      .traffic {
        display: flex;
        gap: 7px;
      }
      .traffic i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ee8176;
      }
      .traffic i:nth-child(2) {
        background: #e6bf6a;
      }
      .traffic i:nth-child(3) {
        background: #8bb28a;
      }
      .window-label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
      }
      .app-layout {
        display: flex;
        height: calc(100% - 35px);
      }
      .sidebar {
        flex: 0 0 96px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 16px 10px;
        background: #242d37;
        color: #bac2cc;
      }
      .brand {
        display: flex;
        justify-content: center;
        margin-bottom: 5px;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
      }
      .nav-items {
        display: grid;
        gap: 8px;
      }
      .nav-button {
        width: 76px;
        min-height: 77px;
        padding: 10px 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 14px;
        color: inherit;
        background: transparent;
        font-size: 10px;
        line-height: 1.4;
      }
      .nav-button svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .nav-button[aria-current='page'] {
        background: #35404b;
        color: #fff5df;
      }
      .nav-button:hover {
        background: #35404b;
      }
      .sidebar-bottom {
        margin-top: auto;
        display: grid;
        gap: 8px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border: 1px solid #5d6a70;
        border-radius: 50%;
        font-size: 11px;
        background: #46574d;
        color: #e4eadc;
      }
      .page {
        flex: 1;
        min-width: 0;
        overflow: auto;
      }
      .page-header {
        height: 70px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 0 38px;
        background: #fffefb;
      }
      .breadcrumb {
        font-size: 12px;
        color: var(--muted);
      }
      .user-pill {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 12px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7c9d84;
      }
      .page-content {
        max-width: 1050px;
        margin: 0 auto;
        padding: 40px;
      }
      .page-content h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: -0.035em;
        color: var(--green);
        margin: 11px 0 12px;
      }
      .page-content p {
        color: var(--muted);
        line-height: 1.6;
      }
      .page-intro {
        margin-bottom: 30px;
      }
      .page-intro .eyebrow {
        color: #897550;
      }
      .workspace-center {
        max-width: 680px;
        padding-top: 65px;
        margin: auto;
      }
      .workspace-center .page-intro {
        text-align: center;
      }
      .prompt-box {
        border: 1px solid #ced5c8;
        border-radius: 17px;
        padding: 23px;
        background: #fffefb;
        box-shadow: 0 7px 18px #2a453609;
      }
      .prompt-box p {
        margin: 0 0 42px;
      }
      .prompt-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #7a8375;
        font-size: 12px;
      }
      .mode-chip {
        border: 1px solid #dfdfd0;
        border-radius: 8px;
        padding: 8px 12px;
        color: #435744;
        background: #f5f4e9;
      }
      .send-chip {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--green);
        color: white;
        font-size: 18px;
      }
      .suggestions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
        justify-content: center;
      }
      .suggestions span {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #ffffff66;
        font-size: 12px;
        color: #6a7568;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .sample-card {
        border: 1px solid #dce1d5;
        border-radius: 15px;
        overflow: hidden;
        background: #fffefb;
      }
      .card-art {
        height: 125px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #687e6c;
        background: #e7eddf;
        font-family: Georgia, serif;
        font-size: 43px;
      }
      .sample-card:nth-child(2) .card-art {
        background: #f1e8d5;
        color: #93794b;
      }
      .card-copy {
        padding: 21px;
      }
      .card-copy h3 {
        margin: 0 0 9px;
        font-size: 16px;
        font-weight: 550;
      }
      .card-copy p {
        margin: 0;
        font-size: 12px;
      }
      .tag {
        display: inline-block;
        border-radius: 5px;
        padding: 5px 7px;
        background: #edf1e8;
        color: #557252;
        font-size: 10px;
        margin-top: 18px;
      }
      .insight-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 22px;
      }
      .metric {
        padding: 23px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffefb;
      }
      .metric strong {
        display: block;
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 400;
        color: var(--green);
        margin-bottom: 8px;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .chart {
        display: flex;
        height: 190px;
        gap: 20px;
        align-items: flex-end;
        padding: 20px 30px;
        border-bottom: 1px solid var(--line);
      }
      .chart i {
        flex: 1;
        background: #acc1a8;
        border-radius: 6px 6px 0 0;
        height: 35%;
      }
      .chart i:nth-child(2) {
        height: 48%;
      }
      .chart i:nth-child(3) {
        height: 42%;
      }
      .chart i:nth-child(4) {
        height: 68%;
      }
      .chart i:nth-child(5) {
        height: 78%;
      }
      .chart i:nth-child(6) {
        height: 88%;
        background: #d5b18a;
      }
      .lesson-art {
        padding: 26px;
        min-height: 188px;
        background: #e7ecd9;
        color: #425e45;
      }
      .lesson-art p {
        color: #6e7e5b;
        font-size: 12px;
        margin: 0 0 25px;
      }
      .lesson-art h2 {
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 400;
        margin: 0;
      }
      .lesson-art span {
        display: block;
        font-family: monospace;
        font-size: 16px;
        margin-top: 20px;
      }
      .spotlight {
        position: absolute;
        pointer-events: none;
        z-index: 10;
        border: 2px solid #efc59b;
        border-radius: 16px;
        box-shadow: 0 0 0 3000px #1c292853;
      }
      .tour-panel {
        position: absolute;
        z-index: 20;
        left: 112px;
        width: 438px;
        max-height: calc(100% - 52px);
        overflow: auto;
        border: 1px solid #dcded2;
        border-radius: 17px;
        background: var(--paper);
        box-shadow: 0 24px 60px #172e332b;
      }
      .tour-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 17px 21px 14px;
      }
      .tour-kicker {
        color: #7a816f;
        font-size: 10px;
        letter-spacing: 0.09em;
        font-weight: 700;
        text-transform: uppercase;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .tour-kicker i {
        width: 6px;
        height: 6px;
        background: #ca8d55;
        border-radius: 50%;
      }
      .close-button {
        border-radius: 7px;
        background: transparent;
        color: #83897f;
        font-size: 22px;
        line-height: 24px;
        width: 30px;
        height: 30px;
      }
      .close-button:hover {
        background: #eeeee5;
      }
      .video-slate {
        margin: 0 17px;
        height: 214px;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        background: #e5e4d6;
      }
      .studio-board {
        position: absolute;
        left: 17px;
        top: 19px;
        width: 49%;
        height: 135px;
        border-radius: 7px;
        background: #334e43;
        color: #eeeee1;
        padding: 17px;
        box-shadow: 0 2px 0 #182d27;
      }
      .studio-board .board-brand {
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 27px;
        opacity: 0.75;
      }
      .board-label {
        margin: 17px 0 0;
        font-size: 12px;
        line-height: 1.5;
        max-width: 130px;
        color: #d9e3d4;
      }
      .board-line {
        width: 40px;
        height: 2px;
        background: #c9a575;
        margin-top: 13px;
      }
      .presenter {
        position: absolute;
        right: 26px;
        bottom: 0;
        width: 145px;
        height: 175px;
      }
      .presenter-head {
        position: absolute;
        top: 7px;
        left: 40px;
        width: 66px;
        height: 76px;
        border-radius: 46% 46% 44% 44%;
        background: #cfbaa0;
      }
      .presenter-head::before {
        content: '';
        position: absolute;
        top: -5px;
        left: -2px;
        width: 70px;
        height: 28px;
        background: #716953;
        border-radius: 40px 40px 12px 8px;
      }
      .presenter-head::after {
        content: '';
        position: absolute;
        left: 23px;
        top: 46px;
        width: 22px;
        height: 8px;
        border-bottom: 2px solid #967d63;
        border-radius: 50%;
      }
      .presenter-body {
        position: absolute;
        bottom: -22px;
        width: 145px;
        height: 120px;
        background: #b5a384;
        border-radius: 60px 60px 0 0;
      }
      .recording-label {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #fffdf0c9;
        color: #6b6d59;
        font-size: 8px;
        letter-spacing: 0.07em;
        padding: 5px 6px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border: 1px solid #ffffffae;
        border-radius: 50%;
        background: #fffdf4eb;
        box-shadow: 0 3px 15px #132f3920;
        color: #364d40;
        font-size: 22px;
      }
      .captions {
        position: absolute;
        bottom: 37px;
        left: 10px;
        right: 10px;
        text-align: center;
        font-size: 11px;
        line-height: 1.5;
        color: white;
      }
      .captions span {
        background: #17251fdd;
        padding: 4px 7px;
        border-radius: 4px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .video-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30px;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 0 11px;
        background: #21372deb;
        color: #f5f4e6;
        font-size: 9px;
      }
      .video-controls button {
        color: inherit;
        padding: 3px 4px;
        background: transparent;
        font-size: 10px;
      }
      .progress-track {
        flex: 1;
        height: 3px;
        border-radius: 3px;
        background: #ffffff36;
        overflow: hidden;
      }
      .progress-fill {
        width: 0;
        height: 100%;
        background: #e6b687;
      }
      .cc-button[aria-pressed='true'] {
        border-bottom: 1px solid #e5b486;
      }
      .tour-copy {
        padding: 20px 24px 12px;
      }
      .step-label {
        margin: 0 0 9px;
        color: #8b775e;
        font-size: 10px;
        font-weight: 650;
      }
      .tour-copy h2 {
        margin: 0 0 10px;
        font-size: 23px;
        font-weight: 550;
        line-height: 1.22;
        letter-spacing: -0.035em;
        color: #2d493c;
      }
      .tour-copy > p {
        margin: 0;
        color: #737a6d;
        font-size: 12px;
        line-height: 1.65;
      }
      .takeaway {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        padding: 11px 12px;
        background: #f1f2e8;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.5;
        color: #5c6f55;
      }
      .takeaway b {
        font-size: 14px;
        color: #899e76;
        font-weight: 400;
      }
      details {
        margin: 13px 0 0;
        color: #737a6d;
        font-size: 11px;
        line-height: 1.6;
      }
      summary {
        cursor: pointer;
        width: fit-content;
      }
      details p {
        margin: 8px 0 0;
      }
      .tour-footer {
        border-top: 1px solid #e9eadf;
        padding: 15px 21px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
      }
      .tour-footer-actions {
        display: flex;
        gap: 7px;
      }
      .dots {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d7dccd;
      }
      .dots i.active {
        width: 19px;
        border-radius: 6px;
        background: #9bb18c;
      }
      .preview-footer {
        min-height: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 28px;
        color: #7c8377;
        font-size: 10px;
      }
      .preview-footer span:first-child {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .preview-footer i {
        width: 5px;
        height: 5px;
        background: #7d9272;
        border-radius: 50%;
      }
      dialog {
        width: min(680px, calc(100% - 32px));
        max-height: calc(100svh - 40px);
        padding: 0;
        border: 1px solid #d8dace;
        border-radius: 17px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 24px 100px #172a3533;
      }
      dialog::backdrop {
        background: #24312966;
      }
      .dialog-header {
        padding: 24px 28px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dialog-header h2 {
        font-size: 20px;
        font-weight: 550;
        margin: 0;
        letter-spacing: -0.025em;
      }
      .dialog-body {
        padding: 27px 28px;
      }
      .dialog-body h3 {
        font-weight: 550;
        font-size: 16px;
        margin: 0 0 9px;
      }
      .dialog-body p {
        color: var(--muted);
        line-height: 1.7;
        font-size: 13px;
      }
      .settings-layout {
        display: grid;
        grid-template-columns: 155px minmax(0, 1fr);
      }
      .settings-nav {
        padding: 24px 15px;
        background: #f1f2e9;
        border-right: 1px solid var(--line);
      }
      .settings-nav strong {
        display: block;
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        background: #e2e7d9;
        color: #4b5e45;
      }
      .settings-section {
        padding: 27px;
      }
      .settings-row {
        display: flex;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        padding: 19px 0;
        border-bottom: 1px solid var(--line);
      }
      .settings-row:first-child {
        padding-top: 0;
      }
      .settings-row h3 {
        font-size: 13px;
        font-weight: 550;
        margin: 0 0 6px;
      }
      .settings-row p {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      .settings-row button {
        flex-shrink: 0;
      }
      .settings-tour {
        padding-top: 22px;
      }
      .settings-tour h3 {
        font-size: 14px;
        font-weight: 550;
        margin: 0 0 8px;
      }
      .settings-tour p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .settings-tour .primary-button {
        margin-top: 8px;
      }
      .settings-tour small {
        display: block;
        font-size: 10px;
        line-height: 1.6;
        color: #818677;
        margin-top: 15px;
      }
      .welcome-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: #edf0e3;
        color: #5b7850;
        border-radius: 15px;
        font-size: 25px;
        margin-bottom: 20px;
      }
      .welcome-title {
        font-family: Georgia, serif;
        font-size: 31px !important;
        color: var(--green);
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 18px 28px;
        border-top: 1px solid var(--line);
      }
      .note-section + .note-section {
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 20px;
      }
      .note-section ol {
        padding-left: 20px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.9;
      }
      .note-section code {
        font-size: 11px;
        color: #47613e;
        background: #edf0e5;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .notice {
        position: fixed;
        z-index: 40;
        bottom: 24px;
        left: 50%;

        dismissTour();
      });
      getElement('finish-button').addEventListener('click', () => {
        getDialog('finish-dialog').close();
      });
      getElement('finish-settings').addEventListener('click', () => {
        getDialog('finish-dialog').close();
        openSettings();
      });
      getElement('notes-button').addEventListener('click', () => {
        pausePlayback();
        getDialog('notes-dialog').showModal();
      });
      getElement('locale').addEventListener('change', (event) => {
        if (
          event.target instanceof HTMLSelectElement &&
          (event.target.value === 'vi' || event.target.value === 'en')
        ) {
          locale = event.target.value;
          translateInterface();
        }
      });
      document.querySelectorAll('[data-close]').forEach((button) => {
        button.addEventListener('click', () => {
          const dialogId = button.getAttribute('data-close');
          if (dialogId) {
            getDialog(dialogId).close();
          }
        });
      });
      steps.forEach((step, index) => {
        getElement(step.anchor).addEventListener('click', () => {
          renderPage(index);
        });
      });
      getElement('transcript').addEventListener('toggle', positionTour);
      window.addEventListener('resize', positionTour);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          pausePlayback();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (!isTourOpen || document.querySelector('dialog[open]')) {
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          dismissTour();
        }
      });
      getDialog('welcome-dialog').addEventListener('close', () => {
        if (!isTourOpen) {
          saveProgress('dismissed');
        }
      });
      const resizeObserver = new ResizeObserver(positionTour);
      resizeObserver.observe(getElement('tour-panel'));
      readProgress();
      translateInterface();
      if (!progress || progress.status === 'in-progress') {
        showStep(progress?.stepIndex ?? 0);
      } else {
        renderPage(progress.stepIndex);
      }
    </script>
  </body>
</html>
