<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tro · Lớp học</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #252d36;
        --muted: #777b82;
        --line: #e8e9eb;
        --paper: #fafaf7;
        --nav: #242d37;
        --orange: #ee926c;
        --violet: #8273bd;
        --blue: #8ec0ed;
        --gold: #efcf7c;
        --green: #8ab7a1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #e8e9e5;
        font-size: 14px;
        line-height: 1.5;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #b8a4ee;
        outline-offset: 4px;
      }
      button {
        border: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(26px, 2.8vw, 38px);
        line-height: 1.2;
        letter-spacing: -1.2px;
        font-weight: 650;
      }
      h2 {
        font-size: 20px;
        font-weight: 620;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 16px;
        font-weight: 620;
      }
      svg {
        display: block;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .app {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr);
        min-height: 100vh;
        max-width: 1800px;
        margin: auto;
        background: #fff;
      }
      .sidebar {
        background: var(--nav);
        color: #aab1ba;
        display: flex;
        align-items: center;
        flex-direction: column;
        padding: 28px 12px 20px;
        gap: 28px;
        position: sticky;
        top: 0;
        height: 100vh;
        z-index: 2;
      }
      .brand {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        color: #fff;
        background: transparent;
        border-radius: 15px;
      }
      .brand-mark {
        width: 39px;
        height: 39px;
      }
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 26px;
      }
      .nav-button {
        width: 100%;
        min-height: 65px;
        border-radius: 14px;
        color: inherit;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 10px;
      }
      .nav-button .icon {
        width: 22px;
        height: 22px;
      }
      .nav-button.active {
        color: #ffe0b7;
        background: #35404b;
      }
      .nav-button:hover {
        background: #35404b;
        color: #fff;
      }
      .sidebar-bottom {
        margin-top: auto;
        width: 100%;
        display: grid;
        gap: 7px;
      }
      .avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #e8d5ad;
        color: #514230;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .sidebar-profile {
        margin-top: 15px;
        padding-top: 18px;
        border-top: 1px solid #46505a;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        color: #c4cad0;
        font-size: 10px;
      }
      .canvas {
        min-width: 0;
        padding: 28px 38px 38px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 43px;
      }
      .search {
        position: relative;
        max-width: 295px;
        flex: 1;
      }
      .search .icon {
        width: 17px;
        height: 17px;
        position: absolute;
        left: 14px;
        top: 12px;
        color: #979aa0;
      }
      .search input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        padding: 10px 14px 10px 40px;
        border-radius: 22px;
        background: #fff;
        color: var(--ink);
      }
      .toolbar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .role-toggle {
        display: flex;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #f7f7f5;
      }
      .role-toggle button {
        padding: 6px 13px;
        border-radius: 18px;
        font-size: 12px;
        background: transparent;
        color: var(--muted);
      }
      .role-toggle button[aria-pressed='true'] {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 5px #1e253310;
      }
      .locale-button {
        background: transparent;
        font-size: 12px;
        padding: 8px;
      }
      .demo-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: #81734f;
        background: #f6f0de;
        padding: 5px 9px;
        border-radius: 7px;
        white-space: nowrap;
      }
      .demo-badge::before {
        content: '';
        width: 5px;
        height: 5px;
        background: #bd9956;
        border-radius: 50%;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.8px;
        margin-bottom: 10px;
      }
      .subtitle {
        color: var(--muted);
        margin-top: 10px;
        max-width: 580px;
      }
      .teacher-note {
        padding: 10px 13px;
        background: #f8f5ed;
        border-radius: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
      }
      .teacher-note .avatar {
        width: 28px;
        height: 28px;
        font-size: 10px;
        background: #e6dfcd;
      }
      .teacher-note span {
        color: var(--muted);
        display: block;
        font-size: 10px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 335px;
        gap: 30px;
        align-items: start;
      }
      .workspace {
        min-width: 0;
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 26px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 25px;
      }
      .tab {
        padding: 12px 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tab.active {
        color: var(--ink);
        border-color: var(--orange);
      }
      .tab .icon {
        width: 16px;
        height: 16px;
      }
      .count {
        font-size: 10px;
        min-width: 18px;
        padding: 0 5px;
        border-radius: 5px;
        background: #f0f0ed;
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .section-label h2 {
        font-size: 18px;
      }
      .section-label .muted {
        font-size: 11px;
      }
      .muted {
        color: var(--muted);
      }
      .lesson-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .lesson-card {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 19px;
        padding: 18px;
        text-align: left;
        position: relative;
        min-width: 0;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.18s,
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .lesson-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 22px #2933420a;
      }
      .lesson-card.selected {
        border-color: #e1ab76;
        background: #fffaf3;
        box-shadow: 0 0 0 2px #edcf9e20;
      }
      .lesson-card.selected::after {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e3ac73;
        right: 16px;
        top: 19px;
      }
      .card-state {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 10px;
        color: #747a80;
      }
      .state-dot {
        height: 5px;
        width: 5px;
        border-radius: 50%;
        background: var(--green);
      }
      .state-dot.violet {
        background: var(--violet);
      }
      .state-dot.blue {
        background: var(--blue);
      }
      .card-art {
        height: 127px;
        margin: 15px auto 11px;
        width: 100%;
        max-width: 150px;
      }
      .lesson-card h3 {
        line-height: 1.3;
        margin-bottom: 5px;
        font-size: 15px;
      }
      .lesson-card p {
        font-size: 11px;
        color: var(--muted);
      }
      .card-foot {
        margin-top: auto;
        padding-top: 19px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: #868a90;
      }
      .card-foot .icon {
        width: 13px;
        height: 13px;
      }
      .card-foot .tag {
        margin-left: auto;
        background: #f0efea;
        color: #777369;
        padding: 3px 7px;
        border-radius: 5px;
      }
      .class-actions {
        display: flex;
        gap: 8px;
        margin-top: 17px;
      }
      .plain-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 9px;
        font-size: 12px;
      }
      .plain-button:hover {
        background: #f6f6f3;
      }
      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--ink);
        color: #fff;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 550;
      }
      .primary-button:hover {
        background: #3d4854;
      }
      .primary-button .icon {
        width: 17px;
        height: 17px;
      }
      .full {
        width: 100%;
      }
      .today {
        margin-top: 35px;
      }
      .activity-list {
        border-top: 1px solid var(--line);
      }
      .activity-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 13px;
        padding: 17px 0;
        border-bottom: 1px solid var(--line);
      }
      .step-number {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #f4f3ef;
        color: #a2a096;
        font-size: 12px;
      }
      .step-number.done {
        background: #eaf3ed;
        color: #63957c;
      }
      .step-number.current {
        background: #fff0d7;
        color: #ae8542;
      }
      .activity-row strong {
        font-size: 13px;
        font-weight: 550;
      }
      .activity-row p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .activity-row .status {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .note-panel {
        margin-top: 25px;
        border-radius: 16px;
        background: #edf3f8;
        padding: 19px 22px;
        display: flex;
        gap: 15px;
        align-items: flex-start;
      }
      .note-panel .icon {
        width: 24px;
        height: 24px;
        color: #6896bf;
        margin-top: 2px;
      }
      .note-panel h3 {
        font-size: 13px;
        margin-bottom: 4px;
      }
      .note-panel p {
        color: #6f7f8e;
        font-size: 12px;
        max-width: 470px;
      }
      .detail {
        background: var(--paper);
        border-radius: 23px;
        padding: 26px;
        position: sticky;
        top: 25px;
        min-width: 0;
      }
      .detail-art {
        height: 160px;
        width: 100%;
        margin: 6px 0 17px;
      }
      .detail .eyebrow {
        font-size: 9px;
        margin-bottom: 7px;
      }
      .detail h2 {
        font-size: 23px;
        line-height: 1.3;
      }
      .detail-desc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 9px;
      }
      .detail-meta {
        display: flex;
        gap: 15px;
        margin-top: 18px;
        font-size: 11px;
        color: #777b82;
      }
      .detail-meta span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .detail-meta .icon {
        width: 14px;
        height: 14px;
      }
      .divider {
        height: 1px;
        background: #e6e5df;
        margin: 22px 0;
      }
      .current-activity {
        border-radius: 12px;
        background: #f6eedb;
        padding: 15px;
        margin: 19px 0 13px;
      }
      .current-activity .eyebrow {
        color: #a1804a;
        font-size: 9px;
        margin-bottom: 5px;
        letter-spacing: 1px;
      }
      .current-activity strong {
        font-size: 13px;
        font-weight: 600;
      }
      .current-activity p {
        color: #8a7a5b;
        font-size: 11px;
        margin-top: 5px;
      }
      .helper-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: #6f6792;
        background: transparent;
        width: 100%;
        font-size: 12px;
        padding: 11px;
      }
      .helper-button:hover {
        background: #f0ecf7;
        border-radius: 9px;
      }
      .helper-button .icon {
        width: 15px;
        height: 15px;
      }
      .materials {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .material-row {
        display: flex;
        align-items: center;
        gap: 9px;
        background: transparent;
        padding: 5px 0;
        text-align: left;
        width: 100%;
      }
      .file-icon {
        width: 31px;
        height: 35px;
        flex-shrink: 0;
        background: #ebe6f2;
        color: #8c79af;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 8px;
        font-weight: 650;
      }
      .material-row div:nth-child(2) {
        min-width: 0;
        flex: 1;
      }
      .material-row strong {
        font-size: 11px;
        font-weight: 550;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .material-row small {
        font-size: 10px;
        color: var(--muted);
      }
      .material-row .icon {
        width: 15px;
        height: 15px;
        color: #85828a;
      }
      .material-row:hover strong {
        text-decoration: underline;
      }
      .submission {
        background: #fff;
        padding: 14px;
        border: 1px solid #eae8e1;
        border-radius: 12px;
      }
      .submission strong {
        font-size: 12px;
        font-weight: 550;
      }
      .submission p {
        color: var(--muted);
        font-size: 11px;
        margin: 4px 0 11px;
      }
      .submission .plain-button {
        width: 100%;
      }
      .saved {
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        color: #789885;
        margin-top: 10px;
      }
      .saved .icon {
        height: 12px;
        width: 12px;
      }
      .prototype-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #93979c;
        font-size: 10px;
        margin-top: 28px;
        gap: 15px;
      }
      .text-button {
        color: #868991;
        background: transparent;
        font-size: 11px;
        padding: 4px 0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .empty {
        padding: 45px 20px;
        border: 1px dashed var(--line);
        border-radius: 16px;
        color: var(--muted);
        grid-column: 1/-1;
        text-align: center;
      }
      .teacher-tools {
        display: grid;
        gap: 9px;
        margin-top: 20px;
      }
      .teacher-section {
        border: 1px solid #e3e3dd;
        border-radius: 12px;
        padding: 13px;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .teacher-section .muted {
        font-size: 11px;
        margin: 4px 0 10px;
      }
      .teacher-section .plain-button {
        width: 100%;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 19px;
        letter-spacing: 3px;
        margin: 8px 0;
      }
      .dialog-backdrop {
        position: fixed;
        inset: 0;
        background: #18212b66;
        backdrop-filter: blur(5px);
        display: grid;
        place-items: center;
        z-index: 8;
        padding: 22px;
      }
      .dialog-backdrop[hidden] {
        display: none;
      }
      .dialog {
        background: #fff;
        padding: 28px;
        border-radius: 23px;
        width: min(100%, 530px);
        max-height: 85vh;
        overflow: auto;
        box-shadow: 0 25px 80px #121c3040;
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
      }
      .dialog-header h2 {
        font-size: 22px;
      }
      .close {
        background: #f4f4f1;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
      }
      .dialog p {
        font-size: 13px;
        color: var(--muted);
      }
      .dialog label {
        display: block;
        font-size: 12px;
        margin: 18px 0 7px;
      }
      .dialog input:not([type='file']),
      .dialog textarea,
      .dialog select {
        border: 1px solid #dfe1e5;
        border-radius: 10px;
        padding: 11px 12px;
        width: 100%;
        color: var(--ink);
        background: #fff;
      }
      .dialog textarea {
        min-height: 95px;
        resize: vertical;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 23px;
      }
      .dialog-info {
        background: #f4f0e6;
        border-radius: 10px;
        padding: 12px;
        margin-top: 15px;
        font-size: 11px;
        color: #8a7957;
      }
      .dropzone {
        background: #faf9f5;
        border: 1px dashed #cbc5b7;
        border-radius: 13px;
        padding: 26px 15px;
        text-align: center;
        margin-top: 18px;
      }
      .dropzone .icon {
        width: 28px;
        height: 28px;
        margin: 0 auto 8px;
      }
      .dropzone label {
        margin: 12px auto 0;
        display: inline-block;
        cursor: pointer;
      }
      .dropzone input {
        width: 1px;
        height: 1px;
        opacity: 0;
        position: absolute;
      }
      .source-list {
        list-style: none;
        padding: 0;
        margin: 15px 0;
      }
      .source-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--line);
        padding: 9px 0;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .source-list button {
        color: #a07868;
        background: transparent;
        font-size: 11px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translate(-50%, 15px);
        background: #293441;
        color: #fff;
        border-radius: 12px;
        padding: 13px 20px;
        max-width: calc(100vw - 40px);
        width: max-content;
        box-shadow: 0 9px 25px #1b253424;
        z-index: 10;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (min-width: 1450px) {
        .canvas {
          padding: 35px 55px 45px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr) 365px;
          gap: 45px;
        }
        .card-art {
          height: 160px;
          max-width: 180px;
        }
        .detail {
          padding: 30px;
        }
      }
      @media (max-width: 1120px) {
        .canvas {
          padding: 25px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr) 300px;
          gap: 22px;
        }
        .lesson-grid {
          gap: 11px;
        }
        .lesson-card {
          padding: 14px;
        }
        .card-art {

              },
            ];
        return `<section class="today"><div class="section-label"><h2>${text('today')}</h2><span class="muted">${isScratch ? text('teacherLeads') : text('selfPaced')}</span></div><div class="activity-list">${steps.map((step, index) => `<div class="activity-row"><span class="step-number ${step.status === 'completed' ? 'done' : step.status === 'current' ? 'current' : ''}">${step.status === 'completed' ? icon('check') : index + 1}</span><div><strong>${escapeHtml(local(step.name))}</strong><p>${escapeHtml(local(step.desc))}</p></div><span class="status">${text(step.status)}</span></div>`).join('')}</div></section>`;
      }
      function materialRow(lesson, name, index) {
        return `<button class="material-row" data-download="${index}"><span class="file-icon">TXT</span><div><strong>${escapeHtml(name)}</strong><small>${text('originals')}</small></div>${icon('download')}</button>`;
      }
      function renderDetail() {
        const lesson = getLesson();
        const studentContent = `<div class="current-activity"><p class="eyebrow">${text(lesson.state === 'live' && teacherLive ? 'liveSection' : lesson.state === 'upcoming' ? 'upcoming' : 'selfPaced')}</p><strong>${escapeHtml(local(lesson.activity))}</strong><p>${escapeHtml(local(lesson.activityDesc))}</p></div><button class="primary-button full" data-action="back">${text(lesson.state === 'upcoming' ? 'explore' : 'returnTask')}${icon('arrow')}</button><button class="helper-button" data-action="help">${icon('chat')}${text('askTro')}</button><div class="divider"></div><h3 style="font-size:12px">${text('materialTitle')}</h3><div class="materials">${lesson.sources.map((name, index) => materialRow(lesson, name, index)).join('')}</div><div class="divider"></div><div class="submission"><strong>${text(submitted && lesson.id === 'scratch' ? 'submitted' : 'submission')}</strong><p>${text('submissionText')}</p><button class="plain-button" data-action="submit" ${lesson.id !== 'scratch' ? 'disabled' : ''}>${icon(submitted ? 'check' : 'upload')}${text(submitted ? 'submitted' : 'submit')}</button></div><div class="saved">${icon('check')}${text('saved')}</div>`;
        const teacherContent = `<div class="teacher-tools"><div class="teacher-section"><strong>${text(prepared[lesson.id] ? 'reviewed' : 'draft')}</strong><p class="muted">${text(prepared[lesson.id] ? 'prepareInfo' : 'draftHint')}</p><button class="plain-button" data-action="prepare">${icon('folder')}${text(prepared[lesson.id] ? 'edit' : 'prepare')}</button></div><div class="teacher-section"><strong>${text('invite')}</strong><p class="muted">${lesson.count} ${text('students')} · ${text('codeLabel')}</p><p class="code">TRO-314</p><button class="plain-button" data-action="invite">${icon('plus')}${text('invite')}</button></div><button class="primary-button full" data-action="start" ${!prepared[lesson.id] ? 'disabled' : ''}>${text(lesson.id === 'scratch' && teacherLive ? 'teacherLive' : 'teacherStart')}${icon('arrow')}</button>${lesson.id === 'scratch' && teacherLive ? `<button class="helper-button" data-action="section">${text('currentSection')}: ${escapeHtml(local(lesson.activity))}</button>` : ''}</div>`;
        document.getElementById('detail').innerHTML =
          `${art('library', 'detail-art')}<div class="detail-heading"><p class="eyebrow">${lesson.tag} · ${text('session')} ${lesson.session}</p><h2>${escapeHtml(local(lesson.title))}</h2><p class="detail-desc">${escapeHtml(local(lesson.detail))}</p><div class="detail-meta"><span>${icon('clock')}${lesson.duration} ${text('minutes')}</span><span>${icon('class')}${role === 'teacher' ? `${lesson.count} ${text('students')}` : locale === 'vi' ? 'Cô Linh' : 'Ms Linh'}</span></div></div><div class="detail-content">${role === 'student' ? studentContent : teacherContent}</div>`;
      }
      function notify(message) {
        clearTimeout(toastTimeout);
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('visible');
        toastTimeout = setTimeout(() => toast.classList.remove('visible'), 5500);
      }
      function openDialog(title, body) {
        lastFocus = document.activeElement;
        const dialog = document.getElementById('dialog');
        dialog.innerHTML = `<div class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="${text('close')}">${icon('close')}</button></div>${body}`;
        document.getElementById('dialog-backdrop').hidden = false;
        const focusTarget = dialog.querySelector('input:not([type="file"]),textarea,select,button');
        focusTarget?.focus();
      }
      function closeDialog() {
        document.getElementById('dialog-backdrop').hidden = true;
        lastFocus?.focus();
      }
      function actionButton(action, key, primary = true) {
        return `<button class="${primary ? 'primary-button' : 'plain-button'}" data-action="${action}">${text(key)}</button>`;
      }
      function openPrepare() {
        openDialog(
          text('prepareTitle'),
          `<p>${text('prepareInfo')}</p><div class="dropzone" id="dropzone">${icon('upload')}<strong>${text('drop')}</strong><p>${text('formats')}</p><label class="plain-button" tabindex="0" for="local-files">${text('chooseFiles')}</label><input id="local-files" type="file" multiple accept=".pdf,.pptx,.sb3,.py,.txt,.md" aria-label="${text('chooseFiles')}" /></div><ul class="source-list" id="source-list"></ul><label for="intent">${text('intent')}</label><textarea id="intent">${text('intentDefault')}</textarea><div class="dialog-info">${text('reviewInfo')}</div><div class="dialog-actions">${actionButton('review', 'reviewSample')}</div>`,
        );
        renderSources();
      }
      function renderSources() {
        document.getElementById('source-list').innerHTML = sourceNames
          .map(
            (name, index) =>
              `<li><span>${escapeHtml(name)}</span><button data-remove-source="${index}" aria-label="${text('remove')}: ${escapeHtml(name)}">${text('remove')}</button></li>`,
          )
          .join('');
      }
      function downloadSample(index) {
        const lesson = getLesson();
        const name = lesson.sources[index] ?? lesson.sources[0];
        const content = `Tro — ${text('originals')}\n${local(lesson.title)}\n\n${local(lesson.activity)}\n${local(lesson.activityDesc)}\n\n${text('materialDemo')}\n`;
        const url = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `Tro-${lesson.id}-SampleNotes.txt`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify(text('materialDemo'));
      }
      function runAction(action) {
        if (action === 'close') {
          closeDialog();
          return;
        }
        if (action === 'student' || action === 'teacher') {
          role = action;
          render();
          return;
        }
        if (action === 'locale') {
          locale = locale === 'vi' ? 'en' : 'vi';
          closeDialog();
          render();
          return;
        }
        if (action === 'home') {
          activeTab = 'classes';
          search = '';
          document.getElementById('search').value = '';
          render();
          return;
        }
        if (action === 'files') {
          activeTab = 'materials';
          render();
          return;
        }
        if (action === 'workspace' || action === 'back') {
          notify(text('mockOpen'));
          return;
        }
        if (action === 'reset') {
          submitted = false;
          teacherLive = true;
          selected = 'scratch';
          role = 'student';
          activeTab = 'classes';
          search = '';
          extraClasses = [];
          prepared = { scratch: true, python: false, design: true };
          sourceNames = ['Mèo di chuyển · Slides.pdf', 'Mèo khởi đầu.sb3'];
          reviewEdits = {};
          activeSections = {};
          microphone = 'auto';
          document.getElementById('search').value = '';
          render();
          notify(text('resetDone'));
          return;
        }
        if (action === 'submit') {
          openDialog(
            text('submitTitle'),
            `<p>${text('submitInfo')}</p><label for="project-link">${text('projectLink')}</label><input type="url" id="project-link" value="https://scratch.mit.edu/projects/123456789/" /><label for="student-note">${text('optionalNote')}</label><textarea id="student-note" placeholder="${text('notePlaceholder')}"></textarea><div class="dialog-info">${text('demoNote')}</div><p id="dialog-error" role="alert" style="color:#b16a4d;margin-top:10px"></p><div class="dialog-actions">${actionButton('close', 'cancel', false)}${actionButton('confirmSubmit', 'confirm')}</div>`,
          );
          return;
        }
        if (action === 'confirmSubmit') {
          const value = document.getElementById('project-link').value.trim();
          if (!/^https:\/\/scratch\.mit\.edu\/projects\/\d+\/?$/.test(value)) {
            document.getElementById('dialog-error').textContent = text('invalidLink');
            return;
          }
          submitted = true;
          closeDialog();
          render();
          notify(text('submitDone'));
          return;
        }
        if (action === 'help') {
          openDialog(
            text('hintTitle'),
            `<p>${text('hintDisclosure')}</p><label for="question">${text('hintQuestion')}</label><textarea id="question" placeholder="${text('hintPlaceholder')}"></textarea><div id="hint-reply" role="status"></div><div class="dialog-actions">${actionButton('showHint', 'showHint')}</div>`,
          );
          return;
        }
        if (action === 'showHint') {
          document.getElementById('hint-reply').innerHTML =
            `<div class="dialog-info">${getLesson().id === 'scratch' ? text('hintResponse') : escapeHtml(local(getLesson().activityDesc))}</div>`;
          return;
        }
        if (action === 'join') {
          openDialog(
            text('joinTitle'),
            `<p>${text('joinInfo')}</p><label for="join-code">${text('codeInput')}</label><input id="join-code" placeholder="TRO-314" /><p id="dialog-error" role="alert" style="color:#b16a4d;margin-top:10px"></p><div class="dialog-actions">${actionButton('confirmJoin', 'join')}</div>`,
          );
          return;
        }
        if (action === 'confirmJoin') {
          if (document.getElementById('join-code').value.trim().toUpperCase() !== 'TRO-314') {
            document.getElementById('dialog-error').textContent = text('invalidCode');
            return;
          }
          selected = 'scratch';
          activeTab = 'classes';
          closeDialog();
          render();
          notify(text('joinDone'));
          return;
        }
        if (action === 'prepare') {
          openPrepare();
          return;
        }
        if (action === 'review') {
          openDialog(
            text('reviewTitle'),
            `<p>${text('reviewInfo')}</p><label for="review-summary">${text('summary')}</label><textarea id="review-summary">${escapeHtml(reviewEdits[selected]?.summary || (selected === 'scratch' ? text('sampleSummary') : `${local(getLesson().detail)} ${local(getLesson().activityDesc)}`))}</textarea><label for="review-sections">${text('sectionNotes')}</label><textarea id="review-sections" style="min-height:140px">${escapeHtml(reviewEdits[selected]?.sections || (selected === 'scratch' ? text('sampleSections') : `1. ${local(getLesson().activity)}\n2. ${local(getLesson().activityDesc)}\n3. ${locale === 'vi' ? 'Thử một thay đổi nhỏ' : 'Try a small change'}`))}</textarea><div class="dialog-actions">${actionButton('approve', 'approve')}</div>`,
          );
          return;
        }
        if (action === 'approve') {
          reviewEdits[selected] = {
            summary: document.getElementById('review-summary').value,
            sections: document.getElementById('review-sections').value,
          };
          prepared[selected] = true;
          closeDialog();
          render();
          notify(text('approvedToast'));
          return;
        }
        if (action === 'invite') {
          openDialog(
            text('invite'),
            `<p>${text('inviteInfo')}</p><div class="dialog-info"><p class="code" style="text-align:center">TRO-314</p></div><div class="dialog-actions">${actionButton('copy', 'copy')}</div>`,
          );
          return;
        }
        if (action === 'copy') {
          if (navigator.clipboard) {
            navigator.clipboard
              .writeText('TRO-314')
              .then(() => notify(text('copyDone')))
              .catch(() => notify(`${text('codeLabel')}: TRO-314`));
          } else {
            notify(`${text('codeLabel')}: TRO-314`);
          }
          return;
        }
        if (action === 'start' || action === 'section') {
          const lesson = getLesson();
          openDialog(
            text('startTitle'),
            `<p>${text('startInfo')}</p><label for="section-choice">${text('currentSection')}</label><select id="section-choice"><option>${escapeHtml(local(lesson.activity))}</option><option>${locale === 'vi' ? 'Chạy thử và thay đổi' : 'Test it and change something'}</option><option>${locale === 'vi' ? 'Chia sẻ dự án' : 'Share the project'}</option></select><div class="dialog-info">${text('demoNote')}</div><div class="dialog-actions">${actionButton('confirmStart', 'startConfirm')}</div>`,
          );
          return;
        }
        if (action === 'confirmStart') {
          const sectionIndex = document.getElementById('section-choice').selectedIndex;
          if (sectionIndex === 1) {
            activeSections[selected] = {
              activity: ['Chạy thử và thay đổi', 'Test it and change something'],
              activityDesc: [
                'Chạy bài của bạn, rồi thay đổi một chi tiết và thử lại.',
                'Run your work, change one detail and try again.',
              ],
            };
          }
          if (sectionIndex === 2) {
            activeSections[selected] = {
              activity: ['Chia sẻ dự án', 'Share the project'],
              activityDesc: [
                'Kiểm tra bài của bạn và chia sẻ với giáo viên.',
                'Check your work and share it with your teacher.',
              ],
            };
          }
          teacherLive = true;
          closeDialog();
          render();
          notify(text('started'));
          return;
        }
        if (action === 'createClass') {
          openDialog(
            text('classTitle'),
            `<label for="class-name">${text('className')}</label><input id="class-name" placeholder="${locale === 'vi' ? 'Ví dụ: Python sáng thứ Bảy' : 'For example: Saturday Python'}" maxlength="60" /><p id="dialog-error" role="alert" style="color:#b16a4d;margin-top:10px"></p><div class="dialog-actions">${actionButton('confirmCreate', 'create')}</div>`,
          );
          return;
        }
        if (action === 'confirmCreate') {
          const name = document.getElementById('class-name').value.trim();
          if (!name) {
            document.getElementById('dialog-error').textContent = text('errorName');
            return;
          }
          const id = `class-${extraClasses.length + 1}`;
          extraClasses.push({ ...lessons[1], id, title: [name, name], count: 0 });
          prepared[id] = false;
          selected = id;
          closeDialog();
          render();
          notify(text('created'));
          return;
        }
        if (action === 'microphone') {
          openDialog(
            text('micTitle'),
            `<p>${text('micInfo')}</p><label for="device">${text('device')}</label><select id="device"><option value="auto" ${microphone === 'auto' ? 'selected' : ''}>${text('deviceDefault')}</option><option value="builtin" ${microphone === 'builtin' ? 'selected' : ''}>${text('micBuiltIn')}</option></select><div class="dialog-actions">${actionButton('saveMicrophone', 'save')}</div>`,
          );
          return;
        }
        if (action === 'saveMicrophone') {
          microphone = document.getElementById('device').value;
          closeDialog();
          notify(text('micSaved'));
          return;
        }
        if (action === 'settings') {
          openDialog(
            text('settings'),
            `<p>${text('settingsInfo')}</p><label for="language-choice">${text('language')}</label><select id="language-choice"><option value="vi" ${locale === 'vi' ? 'selected' : ''}>Tiếng Việt</option><option value="en" ${locale === 'en' ? 'selected' : ''}>English</option></select><div class="dialog-actions">${actionButton('saveSettings', 'save')}</div>`,
          );
          return;
        }
        if (action === 'saveSettings') {
          locale = document.getElementById('language-choice').value;
          closeDialog();
          render();
        }
      }
      document.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button || button.disabled) {
          return;
        }
        if (button.dataset.action) {
          runAction(button.dataset.action);
        } else if (button.dataset.select) {
          selected = button.dataset.select;
          render();
        } else if (button.dataset.tab) {
          activeTab = button.dataset.tab;
          render();
        } else if (button.dataset.download) {
          downloadSample(Number(button.dataset.download));
        } else if (button.dataset.removeSource) {
          sourceNames.splice(Number(button.dataset.removeSource), 1);
          renderSources();
        }
      });
      document.getElementById('search').addEventListener('input', (event) => {
        search = event.target.value;
        renderMain();
      });
      document.addEventListener('change', (event) => {
        if (event.target.id === 'local-files') {
          sourceNames.push(
            ...Array.from(event.target.files)
              .slice(0, 12)
              .map((file) => file.name),
          );
          renderSources();
        }
      });
      document.addEventListener('dragover', (event) => {
        if (event.target.closest('#dropzone')) {
          event.preventDefault();
        }
      });
      document.addEventListener('drop', (event) => {
        if (event.target.closest('#dropzone')) {
          event.preventDefault();
          sourceNames.push(
            ...Array.from(event.dataTransfer.files)
              .slice(0, 12)
              .map((file) => file.name),
          );
          renderSources();
        }
      });
      document.addEventListener('keydown', (event) => {
        const backdrop = document.getElementById('dialog-backdrop');
        if (event.key === 'Escape' && !backdrop.hidden) {
          closeDialog();
        }
        if (
          (event.key === 'Enter' || event.key === ' ') &&
          event.target.matches('label[for="local-files"]')
        ) {
          event.preventDefault();
          document.getElementById('local-files').click();
        }
        if (event.key === 'Tab' && !backdrop.hidden) {
          const items = Array.from(
            document
              .getElementById('dialog')
              .querySelectorAll('button,input:not([type="file"]),textarea,select,[tabindex="0"]'),
          ).filter((item) => !item.disabled);
          const first = items[0],
            last = items[items.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last?.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first?.focus();
          }
        }
      });
      document.getElementById('dialog-backdrop').addEventListener('click', (event) => {
        if (event.target.id === 'dialog-backdrop') {
          closeDialog();
        }
      });
      render();
    </script>
  </body>
</html>
