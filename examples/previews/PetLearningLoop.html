    <style>
      :root {
        --paper: #faf9f5;
        --white: #fffefa;
        --ink: #263d35;
        --muted: #66756d;
        --line: #e2e6dc;
        --green: #285f50;
        --mint: #e6efdf;
        --sage: #93ad80;
        --gold: #ecd49b;
        --peach: #f4dfd1;
        --lavender: #eae5f3;
        --radius: 22px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button,
      select,
      input,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        border: 0;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.53;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #987947;
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      .display {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        letter-spacing: -0.9px;
      }
      h1 {
        font-size: clamp(30px, 3vw, 42px);
        line-height: 1.15;
      }
      h2 {
        font-size: 26px;
        line-height: 1.2;
      }
      h3 {
        font-size: 15px;
        font-weight: 650;
      }
      a {
        color: var(--green);
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .icon.big {
        width: 27px;
        height: 27px;
      }
      .hidden-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .ribbon {
        min-height: 35px;
        padding: 7px 28px;
        background: #edf0e6;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #596850;
        font-size: 11px;
        letter-spacing: 0.1px;
      }
      .ribbon strong {
        font-size: 10px;
        letter-spacing: 1.5px;
        margin-right: 12px;
        color: #385344;
      }
      .ribbon button {
        padding: 0;
        background: none;
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .shell {
        min-height: calc(100vh - 35px);
        display: grid;
        grid-template-columns: 217px minmax(0, 1fr);
      }
      .sidebar {
        border-right: 1px solid var(--line);
        background: #f5f5ed;
        padding: 30px 19px 22px;
        display: flex;
        flex-direction: column;
        gap: 25px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 13px;
        font-size: 34px;
        font-weight: 750;
        letter-spacing: -2px;
      }
      .logo .logo-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ddae74;
        margin-top: 13px;
      }
      .workspace {
        padding: 0 13px;
      }
      .eyebrow {
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 1.6px;
        font-weight: 650;
        color: var(--muted);
      }
      .workspace p {
        margin-top: 5px;
        font-weight: 550;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 14px;
        border-radius: 12px;
        text-align: left;
        background: none;
        color: var(--muted);
      }
      .nav button.active {
        color: var(--green);
        background: #e5ebdd;
        font-weight: 650;
      }
      .nav button:hover {
        background: #eaece2;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 28px 13px 0;
        border-top: 1px solid var(--line);
      }
      .sidebar-bottom label {
        display: block;
        margin-bottom: 8px;
      }
      .sidebar-bottom select {
        width: 100%;
        border: 1px solid #d5dccd;
        background: var(--white);
        padding: 9px 7px;
        border-radius: 9px;
        font-size: 12px;
        color: var(--ink);
      }
      .sidebar-bottom .link-button {
        margin-top: 17px;
        font-size: 12px;
      }
      .main {
        min-width: 0;
        padding: 25px 38px 35px;
        max-width: 1620px;
        width: 100%;
        margin: auto;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 27px;
      }
      .breadcrumb {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .breadcrumb .icon {
        width: 15px;
        height: 15px;
      }
      .account {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .account select {
        background: transparent;
        border: 0;
        color: var(--muted);
        font-size: 12px;
        max-width: 180px;
        padding: 8px 2px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        font-size: 11px;
        font-weight: 650;
        background: #eed9c8;
        color: #74543f;
        flex-shrink: 0;
      }
      .avatar.large {
        width: 50px;
        height: 50px;
        font-size: 15px;
      }
      .avatar.lavender {
        background: #e4dff1;
        color: #706181;
      }
      .avatar.mint {
        background: #dfe9d9;
        color: #516a4b;
      }
      .avatar.gold {
        background: #f0e6c9;
        color: #7b6b38;
      }
      .avatar.blue {
        background: #dee9ec;
        color: #4c6d75;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .page-heading .eyebrow {
        margin-bottom: 9px;
      }
      .subtitle {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        max-width: 640px;
      }
      .balance {
        background: #f1e9d1;
        border: 1px solid #e6dbb9;
        border-radius: 14px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .balance .icon {
        color: #7d753b;
        width: 25px;
        height: 25px;
      }
      .balance strong {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.1;
      }
      .balance small {
        display: block;
        font-size: 10px;
        color: #796f4a;
        letter-spacing: 0.4px;
      }
      .loop-strip {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 13px 17px;
        margin-bottom: 23px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fffefa;
        font-size: 11px;
      }
      .loop-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        color: var(--muted);
        margin-right: 9px;
        white-space: nowrap;
      }
      .loop-step {
        background: none;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0;
        color: var(--muted);
        text-align: left;
      }
      .loop-step.current {
        color: var(--green);
        font-weight: 650;
      }
      .step-number {
        display: grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border: 1px solid #d4ddcd;
        border-radius: 50%;
        font-size: 10px;
        flex-shrink: 0;
      }
      .loop-step.current .step-number {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      .loop-arrow {
        color: #aeb7aa;
      }
      .home-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.9fr) minmax(270px, 1fr);
        gap: 23px;
        align-items: start;
      }
      .world-card {
        border: 1px solid #dce3d2;
        border-radius: var(--radius);
        overflow: hidden;
        background: #eaf0df;
        position: relative;
      }
      .world-top {
        position: absolute;
        top: 20px;
        left: 22px;
        right: 22px;
        display: flex;
        justify-content: space-between;
        align-items: start;
        z-index: 2;
        pointer-events: none;
      }
      .world-top h2 {
        font-size: 23px;
      }
      .world-top p {
        font-size: 11px;
        color: #62755c;
        margin-top: 3px;
      }
      .round-button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #fffef7d9;
        border: 1px solid #d8e1ce;
        pointer-events: auto;
      }
      .scene {
        position: relative;
        aspect-ratio: 1000/590;
        min-height: 280px;
        overflow: hidden;
      }
      .environment {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      .environment > svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .pet-button {
        position: absolute;
        left: 43%;
        top: 48%;
        width: 19%;
        aspect-ratio: 1;
        background: none;
        padding: 0;
        z-index: 2;
        filter: drop-shadow(0 8px 3px #485b3920);
        transition: transform 0.2s;
      }
      .pet-button:hover {
        transform: translateY(-5px) rotate(-3deg);
      }

      /** SVG identifiers must be unique when several houses are shown together.
       * @param {string} instanceId @returns {string} */
      function renderWorldArtwork(instanceId) {
        return WorldArtwork.replace(
          /id="([A-Za-z0-9-]+)"/g,
          (_, id) => `id="${instanceId}-${id}"`,
        ).replace(/url\(#([A-Za-z0-9-]+)\)/g, (_, id) => `url(#${instanceId}-${id})`);
      }

      /** @param {Student} student @returns {string} */
      function renderCatBody(student) {
        return `<span class="cat" role="img" aria-label="${escapeHtml(student.petName)}, a black and white cat"></span>${student.placed.includes('scarf') ? '<span class="scarf" aria-hidden="true"></span>' : ''}`;
      }

      /** @param {Student} student @param {string} backgroundId @returns {string} */
      function renderDesktopScene(student, backgroundId) {
        const background = Shop.find(
          (item) => item.id === backgroundId && item.category === 'background',
        );
        return `<div class="companion-scene" role="img" aria-label="${escapeHtml(student.petName)} ${background ? `with ${background.name}` : 'without a backdrop'}">${background ? `<svg class="scene-backdrop" viewBox="0 0 220 145" aria-hidden="true"><use href="#art-${background.id}"></use></svg>` : ''}<span class="desktop-pet-body" aria-hidden="true">${renderCatBody(student)}</span></div>`;
      }

      /** @param {Student} student @returns {string} */
      function renderDesktopPreview(student) {
        const background = Shop.find((item) => item.id === student.backgroundId);
        return `<section class="panel desktop-panel"><div class="section-title"><h2>Your desktop companion</h2><span class="pill gray">Preview</span></div><div class="desktop-workspace" aria-label="A mock desktop showing the companion"><div class="mock-document" aria-hidden="true"><span class="eyebrow">MY NEXT IDEA</span><span></span><span></span><span></span><span></span></div>${renderDesktopScene(student, student.backgroundId)}</div><div class="desktop-current"><div><small>CURRENT BACKDROP</small><strong>${background ? background.name : 'No background · free'}</strong></div>${background ? '<button class="link-button" data-action="equip-background" data-background="none">Remove backdrop</button>' : ''}</div><div class="desktop-actions"><button class="link-button" data-action="shop-backgrounds">Shop backdrops ${icon('arrow')}</button><span class="subtle">Same Seeds, little scenes.</span></div></section>`;
      }

      /** @param {ShopItem} item @param {Student} student @returns {string} */
      function renderBackgroundItem(item, student) {
        const owned = student.owned.includes(item.id);
        const equipped = student.backgroundId === item.id;
        return `<article class="item"><div class="item-art backdrop-art">${renderDesktopScene(student, item.id)}<button class="preview-chip" data-action="preview-background" data-background="${item.id}" aria-label="Preview ${item.name}">Preview</button></div><div class="item-content"><h3>${item.name}</h3><p>${item.description}</p><button id="buy-${item.id}" data-action="${owned ? 'equip-background' : 'buy'}" ${owned ? `data-background="${item.id}"` : `data-item="${item.id}"`} class="${equipped ? 'placed' : ''}" ${equipped || (!owned && student.seeds < item.price) ? 'disabled' : ''} aria-label="${equipped ? `${item.name} equipped` : owned ? `Equip ${item.name}` : `Buy ${item.name} for ${item.price} Seeds`}">${icon(equipped ? 'check' : owned ? 'plus' : 'seed')}${equipped ? 'Equipped' : owned ? 'Owned · equip' : student.seeds < item.price ? `${item.price} Seeds · save ${item.price - student.seeds} more` : `${item.price} Seeds · buy & equip`}</button></div></article>`;
      }

      /** @param {string} id @returns {void} */
      function openBackgroundPreview(id) {
        const item = Shop.find(
          (candidate) => candidate.id === id && candidate.category === 'background',
        );
        if (!item) {
          return;
        }
        const student = readStudent(state.studentId);
        const owned = student.owned.includes(id);
        const equipped = student.backgroundId === id;
        openDialog(
          `${dialogTitle(item.name)}<span class="pill">Desktop backdrop · cosmetic</span><div class="backdrop-showcase">${renderDesktopScene(student, id)}</div><p>${item.description}. A little setting behind ${escapeHtml(student.petName)} while you work.</p><p>You can switch between owned backdrops or return to no background whenever you like.</p><div class="btn-row"><button class="btn secondary" data-action="close">Back to my world</button><button class="btn" data-action="${owned ? 'equip-background' : 'buy'}" ${owned ? `data-background="${id}"` : `data-item="${id}"`} ${equipped || (!owned && student.seeds < item.price) ? 'disabled' : ''}>${equipped ? `${item.name} equipped` : owned ? 'Equip owned backdrop' : student.seeds < item.price ? `Save ${item.price - student.seeds} more Seeds` : `Buy & equip · ${item.price} Seeds`}</button></div><p style="font-size:11px">${student.seeds} Seeds available · no real money</p>`,
        );
        modal.dataset.dialogType = 'background';
        modal.dataset.background = id;
      }

      /** @param {string} id @returns {void} */
      function equipBackground(id) {
        const student = readStudent(state.studentId);
        if (
          id !== 'none' &&
          !student.owned.some(
            (ownedId) =>
              ownedId === id &&
              Shop.some((item) => item.id === id && item.category === 'background'),
          )
        ) {
          return;
        }
        student.backgroundId = id;
        renderApp();
        if (modal.open && modal.dataset.dialogType === 'background') {
          openBackgroundPreview(id);
        }
        showToast(
          id === 'none'
            ? 'Back to bare paws. Your backdrops stay in your collection.'
            : 'Backdrop equipped. Your desktop preview has a new little scene.',
        );
      }

      /** @returns {void} */
      function openHomeSharing() {
        const student = readStudent(state.studentId);
        openDialog(
          `${dialogTitle('Who can visit your home?')}<p>This is ${student.name.split(' ')[0]}’s own home. Choose whether to show it to classmates in Maple Studio.</p><button class="sharing-choice ${student.homeVisibility === 'private' ? 'active' : ''}" data-action="set-home-visibility" data-visibility="private"><span class="moment-icon">${icon('lock')}</span><span><strong>Only me</strong><small>Keep my home as my own little corner.</small></span>${student.homeVisibility === 'private' ? icon('check') : ''}</button><button class="sharing-choice ${student.homeVisibility === 'class' ? 'active' : ''}" data-action="set-home-visibility" data-visibility="class"><span class="moment-icon">${icon('neighborhood')}</span><span><strong>My class</strong><small>Let classmates visit my house, pet and decorations.</small></span>${student.homeVisibility === 'class' ? icon('check') : ''}</button><div class="design-section" style="margin-top:20px"><h3>Your learning story stays private.</h3><p>Visitors see your first name, house, pet and cosmetics. Visitors cannot see your Seed balance, recognition notes, responses or growth journal. Your teacher still has the classroom records and work you share with them.</p></div><p style="font-size:11px">Class-only in this draft. Your home is not published on the public web.</p>`,
        );
      }

      /** @param {Student} student @param {string} instanceId @returns {string} */
      function renderSharedHomeScene(student, instanceId) {
        return `<div class="scene"><div class="environment" aria-hidden="true">${renderWorldArtwork(instanceId)}</div><span class="pet-figure">${renderCatBody(student)}</span>${student.placed
          .filter(
            (id) =>
              id !== 'scarf' &&
              Shop.some((item) => item.id === id && item.category !== 'background'),
          )
          .map((id) => `<span class="decoration ${id}" aria-hidden="true">${art(id)}</span>`)
          .join('')}</div>`;
      }

      /** A visitor projection deliberately contains no wallet or learning details.
       * @returns {string} */
      function renderNeighborhood() {
        const currentStudent = readStudent(state.studentId);
        const sharedStudents = state.students.filter(
          (student) => student.homeVisibility === 'class',
        );
        return `<header class="page-heading"><div><p class="eyebrow">Maple Studio · classmates only</p><h1>A neighborhood of little worlds.</h1><p class="subtitle">A home for each student. A shared place to say, “Look what I made.”</p></div><span class="pill">${icon('lock')} Class audience</span></header><div class="neighborhood-intro"><div><h3>${currentStudent.homeVisibility === 'class' ? 'Your home is part of the neighborhood.' : 'Your home is just for you, for now.'}</h3><p>Sharing is your choice. Homes are visited, never ranked.</p></div><button class="btn secondary" data-action="sharing">${currentStudent.homeVisibility === 'class' ? 'Change sharing' : 'Share my home'}</button></div><div class="neighborhood-grid">${sharedStudents.map((student) => `<article class="home-tile">${renderSharedHomeScene(student, `tile-${student.id}`)}<div class="home-tile-footer"><div><h3>${student.name.split(' ')[0]}’s home ${student.id === currentStudent.id ? '<span class="pill gray">You</span>' : ''}</h3><p>${escapeHtml(student.petName)} lives here</p></div><button class="btn secondary" data-action="visit-home" data-student="${student.id}" aria-label="Visit ${student.name.split(' ')[0]}’s home">Visit ${icon('arrow')}</button></div></article>`).join('') || '<p class="empty">No homes are shared yet. You can keep yours private or become the first neighbor.</p>'}</div><div class="garden-banner" style="margin-top:26px">${art('plant')}<div class="garden-copy"><h3>And one garden we grow together.</h3><p>Personal homes are yours. The class garden belongs to everyone.</p></div><button class="link-button" data-action="garden">Visit class garden ${icon('arrow')}</button></div><p class="footer-note">${icon('lock')} Only shared homes appear. Seed balances and learning journals are kept out of visits.</p>`;
      }

      /** @param {string} id @returns {void} */
      function openSharedHome(id) {
        const student = state.students.find(
          (candidate) => candidate.id === id && candidate.homeVisibility === 'class',
        );
        if (!student) {
          showToast('This home is not shared with the class.');
          return;
        }
        openDialog(
          `${dialogTitle(`${student.name.split(' ')[0]}’s own little home`)}<div class="visitor-title">${avatar(student)}<div><strong>${escapeHtml(student.petName)} lives here</strong><p>Shared with Maple Studio · a read-only visit</p></div></div><div class="visitor-scene">${renderSharedHomeScene(student, `visit-${student.id}`)}</div><div class="visitor-desktop"><p><strong>${escapeHtml(student.petName)}’s desktop look</strong>A little piece of this world can come along while you work.</p>${renderDesktopScene(student, student.backgroundId)}</div><p style="font-size:11px">You’re visiting the home and cosmetics. The owner’s wallet and learning story stay private.</p><button class="btn secondary" data-action="close">Back to the neighborhood ${icon('arrow')}</button>`,
        );
      }

      /** @param {Student} student @returns {string} */
      function renderHome(student) {
        const memories = readMemories(student);
        const homeName =
          state.presentation === Presentation.STUDIO
            ? `${escapeHtml(student.petName)}’s quiet studio`
            : state.presentation === Presentation.BUILDER
              ? `${escapeHtml(student.petName)}’s little village`
              : `${escapeHtml(student.petName)}’s meadow`;
        const subtitle =
          state.presentation === Presentation.STUDIO
            ? 'A space for your projects, small wins, and next ideas.'
            : 'Little moments of learning. A world that feels like you.';
        return `<header class="page-heading"><div><p class="eyebrow">Your companion, your corner</p><h1>Welcome home, ${student.name.split(' ')[0]}.</h1><p class="subtitle">${subtitle}</p></div><div class="balance" aria-label="${student.seeds} Seeds available">${icon('seed')}<div><strong id="seed-balance">${student.seeds}</strong><small>SEEDS TO SPEND</small></div></div></header>
    ${renderLoop()}<div class="home-grid"><div><section class="world-card" aria-label="Your pet home"><div class="world-top"><div><h2>${homeName}</h2><p>${state.presentation === Presentation.STUDIO ? 'Your pace. Your space.' : 'Sunny, cozy, and a little more yours.'}</p></div><button class="round-button" data-action="companion" aria-label="${state.companionVisible ? 'Hide' : 'Show'} companion in home" aria-pressed="${state.companionVisible}">${icon('eye')}</button></div>
    <div class="scene"><div class="environment" aria-hidden="true">${renderWorldArtwork(`own-${student.id}`)}

        const contributions = countGardenContributions();
        openDialog(
          `${dialogTitle('A little place for all of us.')}<span class="pill">Maple Studio · shared garden</span><div class="class-garden-scene">${art('plant')}${art('plant')}${art(contributions >= 8 ? 'lantern' : 'plant')}${art('plant')}${art('plant')}</div><p><strong>${contributions} shared moments</strong> have helped our garden grow. ${contributions >= 8 ? 'Our reading lantern is here.' : 'At 8 moments, a reading lantern joins our garden.'}</p><div class="progress-track" role="progressbar" aria-label="Class garden progress" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${Math.min(contributions, 8)}"><div class="progress-fill" style="width:${Math.min((contributions / 8) * 100, 100)}%"></div></div><p>Everyone shares this space. No individual has to meet a quota, and nobody’s difficulty takes anything away.</p><div class="btn-row"><button class="btn secondary" data-action="close">Back to my corner</button><button class="btn" data-action="view" data-view="neighborhood">Visit our neighborhood ${icon('arrow')}</button></div>`,
        );
      }
      /** @returns {void} */
      function openDesign() {
        openDialog(
          `${dialogTitle('Start small. Learn something real.')}<p>Our recommendation: pilot recognition + one personal home + evidence-based next steps. The rest can grow with your classroom.</p><div class="design-section"><span class="pill">Start here</span><h3>A calm companion with a meaningful home</h3><p>Four recognition reasons. One Seed currency. A small collection of cosmetics, including optional desktop backdrops. A personal home with opt-in class visits. Permanent memories. A quick teacher view connected to students’ actual work.</p></div><div class="design-section"><span class="pill peach">Pilot next</span><h3>Teach the pet & build together</h3><p>Try short explain-to-Mochi activities and a shared class garden. Find out whether these widen participation and help teachers choose useful follow-ups.</p></div><div class="design-section"><span class="pill lavender">Explore later</span><h3>A world made from student creations</h3><p>Teacher-approved drawings, stories or code projects become objects in the world. Try seasonal community projects and optional peer appreciation after moderation is designed.</p></div><div class="design-section"><h3>Let students choose the tone</h3><p>Garden: simple visual choices for ages 6–9. Builder: projects and a shared village for ages 10–12. Studio: quieter visuals and optional companion for ages 13–15. These are presentation hypotheses, not ability bands.</p><label class="field-label" for="dialog-style">Try a presentation</label><select id="dialog-style" style="padding:9px;border-radius:8px;width:100%;border:1px solid var(--line)">${[
            ['garden', 'Garden · ages 6–9'],
            ['builder', 'Builder · ages 10–12'],
            ['studio', 'Studio · ages 13–15'],
          ]
            .map(
              ([value, label]) =>
                `<option value="${value}" ${state.presentation === value ? 'selected' : ''}>${label}</option>`,
            )
            .join(
              '',
            )}</select></div><div class="design-section"><h3>Design rules worth keeping</h3><ul><li>No public wealth ranking, paid advantage, lost streaks, or unhappy pets after absence.</li><li>Recognize observable actions, including quiet participation. Don’t turn every action into a transaction.</li><li>Keep reward history separate from evidence of understanding. Asking for help is always free.</li><li>Keep decorating for a teacher-chosen break. Teachers can grant to a group in one action.</li></ul></div><div class="design-section"><h3>What would make the pilot worth continuing?</h3><p>Observe a baseline week, then try two weeks with a customer teacher. Compare participation breadth, work on a fresh learning check, student interest without points, and teacher effort. Token spending alone is not a learning result.</p></div><div class="design-section"><h3>What exists in Tro today?</h3><p>Classroom work, learning insights and the local cat/fox companion are existing foundations. Seeds, recognition grants, homes, class visits, inventory and desktop backdrops are proposed. The desktop companion panel is a visual preview; this draft does not change the native pet. Everything here uses fictional data in memory and resets on reload.</p></div>`,
        );
      }
      /** @returns {void} */
      function resetDemo() {
        state.students = createStudents();
        state.moments = createMoments();
        state.selected = new Set(['an']);
        state.studentId = 'an';
        state.view = View.HOME;
        state.presentation = Presentation.GARDEN;
        state.shopTab = 'all';
        state.note = '';
        state.nextId = 7;
        state.lastAward = [];
        state.plan = null;
        state.companionVisible = true;
        if (modal.open) {
          modal.close();
        }
        renderApp();
        showToast('The fictional classroom is ready for another try.');
      }
      /** @param {string|undefined} value @returns {value is View} */
      function isView(value) {
        return (
          value === View.HOME ||
          value === View.CLASSROOM ||
          value === View.INSIGHTS ||
          value === View.NEIGHBORHOOD
        );
      }
      /** @param {string} value @returns {value is Presentation} */
      function isPresentation(value) {
        return (
          value === Presentation.GARDEN ||
          value === Presentation.BUILDER ||
          value === Presentation.STUDIO
        );
      }
      /** @param {string|undefined} value @returns {value is RecognitionKind} */
      function isRecognition(value) {
        return (
          value === 'curiosity' ||
          value === 'persistence' ||
          value === 'explanation' ||
          value === 'contribution'
        );
      }
      document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element)) {
          return;
        }
        const button = event.target.closest('button[data-action]');
        if (!(button instanceof HTMLButtonElement) || button.disabled) {
          return;
        }
        const action = button.dataset.action;
        switch (action) {
          case 'view':
            if (isView(button.dataset.view)) {
              state.view = button.dataset.view;
              if (modal.open) {
                modal.close();
              }
              renderApp();
            }
            break;
          case 'reset':
            resetDemo();
            break;
          case 'close':
            modal.close();
            break;
          case 'design':
            openDesign();
            break;
          case 'companion':
            state.companionVisible = !state.companionVisible;
            renderApp();
            break;
          case 'hello':
            showToast(
              `${readStudent(state.studentId).petName} is happy you’re here. Take things at your own pace.`,
            );
            break;
          case 'sharing':
            openHomeSharing();
            break;
          case 'set-home-visibility':
            if (button.dataset.visibility === 'private' || button.dataset.visibility === 'class') {
              readStudent(state.studentId).homeVisibility = button.dataset.visibility;
              modal.close();
              renderApp();
              showToast(
                button.dataset.visibility === 'class'
                  ? 'Your home is now visible in the class neighborhood.'
                  : 'Your home is now only visible to you.',
              );
            }
            break;
          case 'visit-home':
            if (button.dataset.student) {
              openSharedHome(button.dataset.student);
            }
            break;
          case 'preview-background':
            if (button.dataset.background) {
              openBackgroundPreview(button.dataset.background);
            }
            break;
          case 'equip-background':
            if (button.dataset.background) {
              equipBackground(button.dataset.background);
            }
            break;
          case 'shop-backgrounds':
            state.view = View.HOME;
            state.shopTab = 'background';
            renderApp();
            document.querySelector('.shop')?.scrollIntoView({ block: 'nearest' });
            break;
          case 'shop-tab':
            state.shopTab = button.dataset.tab || 'all';
            renderApp();
            break;
          case 'shop-garden':
            state.shopTab = 'garden';
            renderApp();
            document.querySelector('.shop')?.scrollIntoView({ block: 'nearest' });
            break;
          case 'select-student':
            if (button.dataset.student) {
              const id = button.dataset.student;
              if (state.selected.has(id)) {
                state.selected.delete(id);
              } else {
                state.selected.add(id);
              }
              renderApp();
            }
            break;
          case 'select-all':
            state.selected =
              state.selected.size === state.students.length
                ? new Set()
                : new Set(state.students.map((student) => student.id));
            renderApp();
            break;
          case 'award':
            if (isRecognition(button.dataset.kind)) {
              grantRecognition(button.dataset.kind);
            }
            break;
          case 'undo':
            undoRecognition();
            break;
          case 'buy':
            if (button.dataset.item) {
              buyItem(button.dataset.item);
            }
            break;
          case 'place':
            if (button.dataset.item) {
              placeItem(button.dataset.item);
            }
            break;
          case 'memory':
            openMemory(button.dataset.memory);
            break;
          case 'journal':
            openJournal();
            break;
          case 'garden':
            openGarden();
            break;
          case 'teach':
            openTeach();
            break;
          case 'sample':
            {
              const field = document.getElementById('teach-response');
              if (field instanceof HTMLTextAreaElement) {
                field.value =
                  'The total starts at zero once, before the loop. Then it keeps the earlier numbers as we add 2, 3 and 4. If we reset inside the loop, we lose the earlier additions.';
                field.dispatchEvent(new Event('input', { bubbles: true }));
                field.focus();
              }
            }
            break;
          case 'submit-response':
            submitResponse();
            break;
          case 'ask-help':
            openDialog(
              `${dialogTitle('Let’s take a smaller step.')}<p>Imagine a basket. You put 2 apples in, then add 3. Do you empty the basket before adding the next apples?</p><p>In the code, total is that basket. Try drawing what stays in it after each repeat.</p><button class="btn" data-action="teach">Try my explanation again ${icon('arrow')}</button>`,
            );
            break;
          case 'review':
            if (button.dataset.student) {
              openReview(button.dataset.student);
            }
            break;
          case 'mark-review':
            if (
              button.dataset.student &&
              (button.dataset.review === 'ready' || button.dataset.review === 'retry')
            ) {
              readStudent(button.dataset.student).review = button.dataset.review;
              modal.close();
              renderApp();
              showToast('Your review was recorded. Choose a follow-up when it would help.');
            }
            break;
          case 'plan':
            openPlan();
            break;
          case 'choose-plan':
            choosePlan(Number(button.dataset.plan));
            break;
          case 'preview-plan':
            previewPlan();
            break;
        }
      });
      document.addEventListener('change', (event) => {
        const element = event.target;
        if (!(element instanceof HTMLSelectElement)) {
          return;
        }
        if (
          element.id === 'student-switch' &&
          state.students.some((student) => student.id === element.value)
        ) {
          state.studentId = element.value;
          renderApp();
        }
        if (
          (element.id === 'presentation' || element.id === 'dialog-style') &&
          isPresentation(element.value)
        ) {
          state.presentation = element.value;
          renderApp();
          if (element.id === 'dialog-style') {
            modal.close();
            state.view = View.HOME;
            renderApp();
            showToast('Presentation updated. The learning and reward rules stay the same.');
          }
        }
      });
      document.addEventListener('input', (event) => {
        const element = event.target;
        if (element instanceof HTMLInputElement && element.id === 'award-note') {
          state.note = element.value;
        }
        if (element instanceof HTMLTextAreaElement && element.id === 'teach-response') {
          readStudent(state.studentId).draft = element.value;
          const sendButton = document.getElementById('send-response');
          if (sendButton instanceof HTMLButtonElement) {
            sendButton.disabled = !element.value.trim();
          }
        }
      });
      modal.addEventListener('close', () => {
        if (!modal.open) {
          restoreControlFocus(dialogOpener);
        }
      });
      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          const bounds = modal.getBoundingClientRect();
          if (
            event.clientX < bounds.left ||
            event.clientX > bounds.right ||
            event.clientY < bounds.top ||
            event.clientY > bounds.bottom
          ) {
            modal.close();
          }
        }
      });
      renderApp();
    </script>
  </body>
</html>
