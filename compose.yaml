services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tro
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: tro
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - tro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tro -d tro']
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  tro-postgres:
