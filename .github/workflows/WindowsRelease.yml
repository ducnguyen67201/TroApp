name: Windows Release

on:
  workflow_call:
    inputs:
      release-commit:
        required: true
        type: string
      release-version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply shared desktop version
        env:
          TRO_DESKTOP_RELEASE_VERSION: ${{ inputs.release-version }}
        run: pnpm exec tsx scripts/ApplyDesktopReleaseVersion.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration

  package:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TRO_SIGN_WINDOWS: 'true'
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
      MAIN_VITE_API_BASE_URL: ${{ vars.MAIN_VITE_API_BASE_URL }}
      MAIN_VITE_APP_ENV: prod
      MAIN_VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.MAIN_VITE_POSTHOG_PROJECT_TOKEN }}
      MAIN_VITE_POSTHOG_HOST: ${{ vars.MAIN_VITE_POSTHOG_HOST }}
      MAIN_VITE_UPDATE_FEED_URL: ${{ vars.MAIN_VITE_UPDATE_FEED_URL }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply shared desktop version
        env:
          TRO_DESKTOP_RELEASE_VERSION: ${{ inputs.release-version }}
        run: pnpm exec tsx scripts/ApplyDesktopReleaseVersion.ts
      - name: Check release settings
        run: pnpm exec tsx scripts/WindowsSigning.ts --check-windows-release
      - name: Test Windows verifier
        run: |
          ./scripts/VerifyWindowsRelease.ps1 -Mode Test
          ./scripts/CheckWindowsInstaller.ps1 -Mode Test
      - name: Build Windows companion
        run: |
          $installerDirectory = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $installation = & (Join-Path $installerDirectory 'vswhere.exe') -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) { throw 'MSVC build tools are missing.' }
          $installer = Start-Process -FilePath (Join-Path $installerDirectory 'setup.exe') -ArgumentList @('modify', '--installPath', ('"' + $installation + '"'), '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart') -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) { throw 'Could not install the required MSVC libraries.' }
          rustup toolchain install 1.97.1 --profile minimal
          pnpm build:cua
      - name: Azure OIDC login
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package and sign
        run: pnpm package:desktop
      - name: Verify final signatures and update hashes
        run: |
          $requireMetadata = -not [string]::IsNullOrWhiteSpace($env:MAIN_VITE_UPDATE_FEED_URL)
          ./scripts/VerifyWindowsRelease.ps1 -Directory release -RequireUpdateMetadata:$requireMetadata
      - name: Check installed version and shortcuts
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: ./scripts/CheckWindowsInstaller.ps1 -Version $env:RELEASE_VERSION
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tro-${{ inputs.release-version }}-windows-x64-${{ inputs.release-commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Tro-*-windows-x64-setup.exe
            release/Tro-*-windows-x64-setup.exe.blockmap
            release/latest.yml
            release/WindowsSignatures.json
