name: Windows Release

on:
  workflow_call:
    inputs:
      release-commit:
        required: true
        type: string
      release-version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TRO_NATIVE_RUNNER_LABEL: windows-2022
      RUSTUP_TOOLCHAIN: '1.97.1'
      TRO_SIGN_WINDOWS: 'true'
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
      MAIN_VITE_API_BASE_URL: ${{ vars.MAIN_VITE_API_BASE_URL }}
      MAIN_VITE_APP_ENV: prod
      MAIN_VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.MAIN_VITE_POSTHOG_PROJECT_TOKEN }}
      MAIN_VITE_POSTHOG_HOST: ${{ vars.MAIN_VITE_POSTHOG_HOST }}
      MAIN_VITE_UPDATE_FEED_URL: ${{ vars.MAIN_VITE_UPDATE_FEED_URL }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Configure packaging download caches
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "electron_config_cache=$env:RUNNER_TEMP/tro-electron-downloads"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ELECTRON_BUILDER_CACHE=$env:RUNNER_TEMP/tro-builder-cache"
      - name: Restore packaging downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/tro-electron-downloads
            ${{ runner.temp }}/tro-builder-cache/downloads
            ${{ runner.temp }}/tro-builder-cache/**/*.zip
            ${{ runner.temp }}/tro-builder-cache/**/*.7z
            ${{ runner.temp }}/tro-builder-cache/**/*.tar.*
          key: tro-packaging-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Apply shared desktop version
        env:
          TRO_DESKTOP_RELEASE_VERSION: ${{ inputs.release-version }}
        run: pnpm exec tsx scripts/ApplyDesktopReleaseVersion.ts
      - name: Check release settings
        run: pnpm exec tsx scripts/WindowsSigning.ts --check-windows-release
      - name: Test Windows verifier
        run: |
          ./scripts/VerifyWindowsRelease.ps1 -Mode Test
          ./scripts/CheckWindowsInstaller.ps1 -Mode Test
          ./scripts/InstallWindowsBuildTools.ps1 -Mode Test
      - name: Identify native companion cache
        id: native-cache-key
        run: pnpm exec tsx scripts/CheckNativeCompanionCache.ts --key
      - name: Restore tested native companion
        id: native-output-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/tro/cua-companion
          key: ${{ steps.native-cache-key.outputs.key }}
      - name: Validate native companion cache
        id: native-cache-check
        run: pnpm exec tsx scripts/CheckNativeCompanionCache.ts --check
      - name: Restore native build cache
        id: native-build-cache
        if: steps.native-cache-check.outputs.reusable != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tro/cua-companion-build
          key: tro-native-v1-${{ runner.os }}-${{ runner.arch }}-windows-2022-rust-1.97.1-${{ hashFiles('driver-patches/CursorCompanion.patch', 'src/contracts/CuaCompanionBuild.ts', 'scripts/BuildCuaCompanion.ts') }}
          restore-keys: tro-native-v1-${{ runner.os }}-${{ runner.arch }}-windows-2022-rust-1.97.1-
      - name: Install Windows build tools
        if: steps.native-cache-check.outputs.reusable != 'true'
        timeout-minutes: 12
        run: ./scripts/InstallWindowsBuildTools.ps1
      - name: Install Rust toolchain
        if: steps.native-cache-check.outputs.reusable != 'true'
        run: |
          Write-Host 'Installing Rust toolchain 1.97.1.'
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed (exit code $LASTEXITCODE)." }
          Write-Host 'Rust toolchain installation completed.'
      - name: Build Windows companion
        if: steps.native-cache-check.outputs.reusable != 'true'
        run: pnpm build:cua
      - name: Record tested native companion
        if: steps.native-cache-check.outputs.reusable != 'true'
        run: pnpm exec tsx scripts/CheckNativeCompanionCache.ts --record
      - name: Save tested native companion
        if: steps.native-cache-check.outputs.reusable != 'true' && steps.native-output-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/tro/cua-companion
          key: ${{ steps.native-cache-key.outputs.key }}
      - name: Save native build cache
        if: steps.native-cache-check.outputs.reusable != 'true' && steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tro/cua-companion-build
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}
      - name: Azure OIDC login
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package and sign
        run: pnpm package:desktop
      - name: Verify final signatures and update hashes
        run: |
          $requireMetadata = -not [string]::IsNullOrWhiteSpace($env:MAIN_VITE_UPDATE_FEED_URL)
          ./scripts/VerifyWindowsRelease.ps1 -Directory release -RequireUpdateMetadata:$requireMetadata
      - name: Check installed version and shortcuts
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: ./scripts/CheckWindowsInstaller.ps1 -Version $env:RELEASE_VERSION
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tro-${{ inputs.release-version }}-windows-x64-${{ inputs.release-commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Tro-*-windows-x64-setup.exe
            release/Tro-*-windows-x64-setup.exe.blockmap
            release/latest.yml
            release/WindowsSignatures.json
