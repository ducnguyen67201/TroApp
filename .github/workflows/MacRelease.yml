name: macOS Release

on:
  workflow_call:
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
    inputs:
      release-commit:
        required: true
        type: string
      release-version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            app-directory: mac-arm64
          - runner: macos-15-intel
            architecture: x64
            app-directory: mac
    runs-on: ${{ matrix.runner }}
    environment: release
    env:
      TRO_NATIVE_RUNNER_LABEL: ${{ matrix.runner }}
      MAIN_VITE_API_BASE_URL: ${{ vars.MAIN_VITE_API_BASE_URL }}
      MAIN_VITE_APP_ENV: prod
      MAIN_VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.MAIN_VITE_POSTHOG_PROJECT_TOKEN }}
      MAIN_VITE_POSTHOG_HOST: ${{ vars.MAIN_VITE_POSTHOG_HOST }}
      MAIN_VITE_UPDATE_FEED_URL: ${{ vars.MAIN_VITE_UPDATE_FEED_URL }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTUP_TOOLCHAIN: '1.95.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check native architecture and tools
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node -e 'if (process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCHITECTURE) process.exit(1)'
          test "$(uname -m)" = "$(test "$EXPECTED_ARCHITECTURE" = arm64 && echo arm64 || echo x86_64)"
          xcrun --find notarytool
      - name: Configure packaging download caches
        run: |
          printf 'electron_config_cache=%s/tro-electron-downloads\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ELECTRON_BUILDER_CACHE=%s/tro-builder-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore packaging downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/tro-electron-downloads
            ${{ runner.temp }}/tro-builder-cache/downloads
            ${{ runner.temp }}/tro-builder-cache/**/*.zip
            ${{ runner.temp }}/tro-builder-cache/**/*.7z
            ${{ runner.temp }}/tro-builder-cache/**/*.tar.*
          key: tro-packaging-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Apply shared desktop version
        env:
          TRO_DESKTOP_RELEASE_VERSION: ${{ inputs.release-version }}
        run: pnpm exec tsx scripts/ApplyDesktopReleaseVersion.ts
      - name: Restore Electron header cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.electron-gyp
          key: tro-electron-headers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare verified Electron headers without signing credentials
        run: pnpm exec tsx scripts/PrepareElectronHeaders.ts
      - name: Identify native companion cache
        id: native-cache-key
        run: pnpm exec tsx scripts/CheckNativeCompanionCache.ts --key
      - name: Restore tested native companion
        id: native-output-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/tro/cua-companion
          key: ${{ steps.native-cache-key.outputs.key }}
      - name: Validate native companion cache
        id: native-cache-check
        run: pnpm exec tsx scripts/CheckNativeCompanionCache.ts --check
      - name: Restore native build cache
        id: native-build-cache
        if: steps.native-cache-check.outputs.reusable != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tro/cua-companion-build
          key: tro-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-rust-1.95.0-${{ hashFiles('driver-patches/CursorCompanion.patch', 'src/contracts/CuaCompanionBuild.ts', 'scripts/BuildCuaCompanion.ts') }}
          restore-keys: tro-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-rust-1.95.0-
      - name: Install Rust toolchain
        if: steps.native-cache-check.outputs.reusable != 'true'
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build and test pinned native companion without signing credentials
        if: steps.native-cache-check.outputs.reusable != 'true'
        run: pnpm build:cua
      - name: Record tested native companion
        if: steps.native-cache-check.outputs.reusable != 'true'
        run: pnpm exec tsx scripts/CheckNativeCompanionCache.ts --record
      - name: Save tested native companion
        if: steps.native-cache-check.outputs.reusable != 'true' && steps.native-output-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/tro/cua-companion
          key: ${{ steps.native-cache-key.outputs.key }}
      - name: Save native build cache
        if: steps.native-cache-check.outputs.reusable != 'true' && steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tro/cua-companion-build
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}
      - name: Download Apple Developer ID intermediate certificate
        run: |
          set -euo pipefail
          umask 077
          credential_directory="$RUNNER_TEMP/tro-mac-signing"
          mkdir -p "$credential_directory"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer --output "$credential_directory/DeveloperIDG2CA.cer"
          printf 'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  %s\n' "$credential_directory/DeveloperIDG2CA.cer" | shasum -a 256 --check
      - name: Install temporary signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          credential_directory="$RUNNER_TEMP/tro-mac-signing"
          mkdir -p "$credential_directory"
          printf '%s' "$CSC_LINK" | base64 --decode > "$credential_directory/identity.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          signing_keychain="$credential_directory/release.keychain-db"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$credential_directory/DeveloperIDG2CA.cer" -t cert -k "$signing_keychain"
          security import "$credential_directory/identity.p12" -P "$CSC_KEY_PASSWORD" -t cert -f pkcs12 -k "$signing_keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$signing_keychain" >/dev/null
          # Preserve the runner's existing search list. Never replace a developer login keychain.
          python3 - "$signing_keychain" "$credential_directory/search-list.json" <<'PYTHON'
          import json, shlex, subprocess, sys
          previous = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          with open(sys.argv[2], 'w') as file:
              json.dump(previous, file)
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[1], *previous], check=True)
          PYTHON
          rm "$credential_directory/identity.p12"
          xcrun notarytool store-credentials tro-ci-notary --keychain "$signing_keychain" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Package, notarize and verify distribution files
        env:
          TRO_SIGN_MACOS: 'true'
          MACOS_SIGNING_IDENTITY_SHA1: ${{ vars.MACOS_SIGNING_IDENTITY_SHA1 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          APP_DIRECTORY: ${{ matrix.app-directory }}
        run: |
          set -euo pipefail
          export CSC_KEYCHAIN="$RUNNER_TEMP/tro-mac-signing/release.keychain-db"
          export APPLE_KEYCHAIN="$CSC_KEYCHAIN"
          export APPLE_KEYCHAIN_PROFILE=tro-ci-notary
          pnpm exec tsx scripts/MacSigning.ts --check-macos-release
          pnpm package:desktop
          pnpm exec tsx scripts/VerifyMacRelease.ts --directory release --arch "$EXPECTED_ARCHITECTURE"
          pnpm check:microphone-package "release/$APP_DIRECTORY/Tro.app"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          credential_directory="$RUNNER_TEMP/tro-mac-signing"
          trap 'security delete-keychain "$credential_directory/release.keychain-db" >/dev/null 2>&1 || true; rm -rf "$credential_directory"' EXIT
          python3 - "$credential_directory/search-list.json" <<'PYTHON'
          import json, os, subprocess, sys
          if os.path.exists(sys.argv[1]):
              with open(sys.argv[1]) as file:
                  previous = json.load(file)
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *previous], check=True)
          PYTHON
          if test -f "$credential_directory/release.keychain-db"; then
            security delete-keychain "$credential_directory/release.keychain-db"
          fi
          rm -rf "$credential_directory"
      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tro-${{ inputs.release-version }}-macos-${{ matrix.architecture }}-${{ inputs.release-commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Tro-*-macos-${{ matrix.architecture }}.dmg
            release/Tro-*-macos-${{ matrix.architecture }}.zip
            release/MacSignatures-${{ matrix.architecture }}.json
