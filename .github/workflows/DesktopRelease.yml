name: Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reserve shared desktop version
        id: version
        run: pnpm exec tsx scripts/PrepareDesktopRelease.ts
      - name: Record release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf '## Desktop %s\n\nTag: `%s`\n\nCommit: `%s`\n' "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/WindowsRelease.yml
    with:
      release-commit: ${{ needs.prepare.outputs.commit }}
      release-version: ${{ needs.prepare.outputs.version }}

  macos:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/MacRelease.yml
    with:
      release-commit: ${{ needs.prepare.outputs.commit }}
      release-version: ${{ needs.prepare.outputs.version }}
