packages:
  - '.'
overrides:
  '@better-auth/core': 1.7.6
  # Keep security updates scoped to the affected transitive versions.
  'deepmerge-ts@<8.0.0': 8.0.2
  'http-cache-semantics@<=4.2.0': 4.3.0
  'mysql2@<3.23.1': 3.23.1
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # The downloader uses bootstrap(); this release removes roarr/sprintf-js.
  '@electron/get@^3.0.0>global-agent': 4.1.3
allowBuilds:
  '@prisma/engines': true
  electron: true
  electron-winstaller: false
  esbuild: true
  prisma: true
  uiohook-napi: true
minimumReleaseAgeExclude:
  - electron@44.5.1
patchedDependencies:
  http-cache-semantics@4.3.0: patches/HttpCacheSemantics.patch
